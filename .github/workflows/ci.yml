name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: briefly
          POSTGRES_PASSWORD: briefly
          POSTGRES_DB: briefly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U briefly"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://briefly:briefly@localhost:5432/briefly_test
      DATABASE_URL: postgresql+psycopg://briefly:briefly@localhost:5432/briefly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Migrations apply cleanly
        run: flask --app app.wsgi db upgrade
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm run test:coverage
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          touch .env
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci docker compose -f docker-compose.prod.yml config --quiet
      - name: Build images
        run: |
          docker build -f infrastructure/docker/backend.Dockerfile backend
          docker build -f infrastructure/docker/frontend.prod.Dockerfile frontend
      - name: Smoke test dev stack
        run: |
          docker compose up -d --build --wait db backend
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/api/health
          docker compose exec -T backend flask --app app.wsgi sources sync
          # Categorize/rank with no feeds and no AI key: the API must still serve a briefing.
          docker compose exec -T backend flask --app app.wsgi process run --no-ai
          curl --fail -s http://localhost:8000/api/briefing/today | grep -q '"top_stories"'
          curl --fail -s http://localhost:8000/api/openapi.json | grep -q '"openapi"'
      - name: Dev stack logs and teardown
        if: always()
        run: docker compose logs backend && docker compose down -v

      - name: Smoke test production stack
        run: |
          printf 'POSTGRES_USER=ci\nPOSTGRES_PASSWORD=ci-password-not-secret\nWEB_PORT=8080\n' > .env
          docker compose -f docker-compose.prod.yml up -d --build --wait db backend web
          base=http://localhost:8080
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors -s $base/api/health | grep -q '"status":"ok"'
          # SPA shell, client-side route fallback, and production security headers
          curl --fail -sD headers.txt $base/ -o index.html
          grep -qi "^content-security-policy: default-src 'self'; script-src 'self'" headers.txt
          grep -qi '^x-content-type-options: nosniff' headers.txt
          curl --fail -s $base/category/breaking-news | grep -q '<title>Briefly</title>'
          # Hashed assets are long-cached AND keep the security headers (nginx add_header pitfall)
          asset=$(grep -o '/assets/index-[^"]*\.js' index.html | head -1)
          curl --fail -sI $base$asset | tee asset-headers.txt
          grep -qi '^cache-control: max-age=31536000' asset-headers.txt
          grep -qi '^x-content-type-options: nosniff' asset-headers.txt
          curl --fail -s $base/theme-init.js | grep -q "briefly-theme"
          # The API is reachable through the proxy and the admin endpoint fails closed
          curl --fail -s $base/api/briefing/today | grep -q '"top_stories"'
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST $base/api/articles/00000000-0000-0000-0000-000000000000/summarize)" = 403
      - name: Production stack logs and teardown
        if: always()
        run: docker compose -f docker-compose.prod.yml logs backend web && docker compose -f docker-compose.prod.yml down -v
