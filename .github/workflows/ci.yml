name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: briefly
          POSTGRES_PASSWORD: briefly
          POSTGRES_DB: briefly_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U briefly"
          --health-interval 5s --health-timeout 3s --health-retries 10
    env:
      TEST_DATABASE_URL: postgresql+psycopg://briefly:briefly@localhost:5432/briefly_test
      DATABASE_URL: postgresql+psycopg://briefly:briefly@localhost:5432/briefly_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r requirements-dev.txt
      - name: Lint
        run: ruff check . && ruff format --check .
      - name: Type check
        run: mypy
      - name: Migrations apply cleanly
        run: flask --app app.wsgi db upgrade
      - name: Tests
        run: pytest --cov --cov-report=term-missing --cov-fail-under=80

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  docker:
    runs-on: ubuntu-latest
    needs: [backend, frontend]
    steps:
      - uses: actions/checkout@v4
      - name: Validate compose files
        run: |
          docker compose -f docker-compose.yml config --quiet
          touch .env
          POSTGRES_USER=ci POSTGRES_PASSWORD=ci docker compose -f docker-compose.prod.yml config --quiet
      - name: Build images
        run: |
          docker build -f infrastructure/docker/backend.Dockerfile backend
          docker build -f infrastructure/docker/frontend.prod.Dockerfile frontend
      - name: Smoke test dev stack
        run: |
          docker compose up -d --build --wait db backend
          curl --fail --retry 10 --retry-delay 2 --retry-all-errors http://localhost:8000/api/health
      - if: always()
        run: docker compose logs backend && docker compose down -v
