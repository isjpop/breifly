# Development environment: `docker compose up --build`
#   Frontend  http://localhost:5173  (Vite, hot reload; proxies /api to backend)
#   Backend   http://localhost:8000  (Flask/gunicorn with --reload)
#   Postgres  localhost:5432
services:
  db:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-briefly}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-briefly}
      POSTGRES_DB: ${POSTGRES_DB:-briefly}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infrastructure/docker/init-test-db.sql:/docker-entrypoint-initdb.d/init-test-db.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-briefly} -d ${POSTGRES_DB:-briefly}"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build:
      context: ./backend
      dockerfile: ../infrastructure/docker/backend.Dockerfile
      args:
        INSTALL_DEV: "true"
    env_file:
      - path: .env
        required: false
    environment:
      APP_ENV: development
      DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-briefly}:${POSTGRES_PASSWORD:-briefly}@db:5432/${POSTGRES_DB:-briefly}
      TEST_DATABASE_URL: postgresql+psycopg://${POSTGRES_USER:-briefly}:${POSTGRES_PASSWORD:-briefly}@db:5432/briefly_test
    command: ["gunicorn", "--bind", "0.0.0.0:8000", "--reload", "--access-logfile", "-", "app.wsgi:app"]
    ports:
      - "8000:8000"
    volumes:
      - ./backend:/app
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: ../infrastructure/docker/frontend.Dockerfile
    environment:
      VITE_API_PROXY_TARGET: http://backend:8000
    ports:
      - "5173:5173"
    volumes:
      - ./frontend:/app
      - /app/node_modules
    depends_on:
      - backend

volumes:
  postgres_data:
