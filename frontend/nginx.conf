# Production web server: serves the built SPA and proxies /api to the backend.
# These security headers are also applied by `vite preview` (see vite.config.ts), so local
# preview behaves like production.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    server_tokens off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;

    # NOTE: nginx drops these server-level headers in any location that declares its own
    # add_header, so locations below must not use add_header.
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header X-Frame-Options "DENY" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self'; img-src 'self' https: data:; connect-src 'self'; font-src 'self'; object-src 'none'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'" always;

    location /api/ {
        proxy_pass http://backend:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        client_max_body_size 16k;
    }

    # Content-hashed build output: cache for a year (expires sets Cache-Control).
    location /assets/ {
        expires 1y;
    }

    # Client-side routing: unknown paths fall back to the SPA shell, which is never cached.
    location / {
        expires -1;
        try_files $uri /index.html;
    }
}
